---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Read installed nginx packages
      ansible.builtin.package_facts:
        manager: apt

    - name: Nginx.org 1.30.6 installed and Ubuntu packages gone
      ansible.builtin.assert:
        that:
          - ansible_facts.packages['nginx'][0].version is match('1\.30\.6-')
          - "'nginx-common' not in ansible_facts.packages"

    - name: Package is held
      ansible.builtin.command: apt-mark showhold
      register: __hold
      changed_when: false
      failed_when: "'nginx' not in __hold.stdout_lines"

    - name: Service is active
      ansible.builtin.systemd_service:
        name: nginx
      register: __svc
      failed_when: __svc.status.ActiveState != 'active'

    - name: Vhost directories exist
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled
      register: __dir
      failed_when: not __dir.stat.isdir

    - name: Configuration is valid
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Check the package default.conf
      ansible.builtin.stat:
        path: /etc/nginx/conf.d/default.conf
      register: __default_conf

    - name: Default.conf removed only where requested
      ansible.builtin.assert:
        that: __default_conf.stat.exists != (nginx_remove_package_default_conf | default(false))

    - name: Read listening sockets
      ansible.builtin.command: ss -Hltn
      register: __ss
      changed_when: false

    - name: Running nginx has no default server on :80 where default.conf was removed
      ansible.builtin.assert:
        that: __ss.stdout is not search(':80\s')
      when: nginx_remove_package_default_conf | default(false)
