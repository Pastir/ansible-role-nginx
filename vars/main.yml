---
__nginx_pkg_version: "{{ nginx_version ~ '-*~' ~ ansible_facts['distribution_release'] }}"
# Ubuntu's own nginx packages conflict with the nginx.org package.
__nginx_ubuntu_packages:
  - nginx-common
  - nginx-core
  - nginx-full
  - nginx-light
  - nginx-extras
# Shipped by the nginx.org package; removed when nginx_remove_package_default_conf is true.
__nginx_package_default_conf: /etc/nginx/conf.d/default.conf
# md5 of the package's copy, from `dpkg-query -W -f='${Conffiles}' nginx` ('' if unknown).
__nginx_default_conf_pkg_md5: >-
  {{ (__nginx_conffiles.stdout | default('')
      | regex_search('^\s*' ~ (__nginx_package_default_conf | regex_escape) ~ '\s+([0-9a-f]{32})', '\1', multiline=True)
      | default([''], true)) | first }}
