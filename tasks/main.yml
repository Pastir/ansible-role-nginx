---
- name: Add nginx.org repository
  when: nginx_repo_enabled
  tags: [nginx, nginx_install]
  block:
    - name: Create keyrings directory
      ansible.builtin.file:
        path: "{{ nginx_keyring | dirname }}"
        state: directory
        mode: "0755"

    - name: Download nginx signing key
      ansible.builtin.get_url:
        url: "{{ nginx_signing_key_url }}"
        dest: "{{ nginx_keyring }}"
        mode: "0644"

    # Older setups used list files; keep exactly one source.
    - name: Remove legacy list-style sources
      ansible.builtin.file:
        path: "/etc/apt/sources.list.d/{{ item }}"
        state: absent
      loop: [nginx.list, nginx.org.list]

    - name: Add nginx.org apt source
      ansible.builtin.deb822_repository:
        name: nginx
        types: [deb]
        uris: ["{{ nginx_repo_url }}"]
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [nginx]
        signed_by: "{{ nginx_keyring }}"
        install_python_debian: true
      register: __nginx_repo

    # Prefer nginx.org over the Ubuntu archive for the nginx package.
    - name: Pin nginx.org packages
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/99nginx
        content: |
          # Managed by Ansible (pastir.nginx), do not edit.
          Package: *
          Pin: origin nginx.org
          Pin-Priority: 900
        owner: root
        group: root
        mode: "0644"

- name: Gather installed packages
  ansible.builtin.package_facts:
    manager: apt
  tags: [nginx, nginx_install]

- name: Refuse implicit nginx change
  ansible.builtin.assert:
    that:
      - nginx_allow_upgrade or ansible_facts.packages['nginx'][0].version is match((nginx_version | regex_escape) ~ '-')
      - nginx_allow_upgrade or (__nginx_ubuntu_packages | select('in', ansible_facts.packages) | list | length == 0)
    fail_msg: >-
      nginx {{ ansible_facts.packages['nginx'][0].version }} is installed
      ({{ 'Ubuntu build' if __nginx_ubuntu_packages | select('in', ansible_facts.packages) | list else 'nginx.org build' }}),
      {{ nginx_version }} from nginx.org is required. Re-run with -e nginx_allow_upgrade=true
      (nginx is restarted; config in /etc/nginx is kept).
    quiet: true
  when:
    - nginx_version | length > 0
    - "'nginx' in ansible_facts.packages"
  tags: [nginx, nginx_install]

- name: Install nginx
  ansible.builtin.apt:
    name: "{{ ['nginx' ~ (('=' ~ __nginx_pkg_version) if nginx_version else '')] + nginx_extra_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if (__nginx_repo is defined and __nginx_repo is changed) else 3600 }}"
    allow_change_held_packages: true
    allow_downgrade: "{{ nginx_allow_upgrade }}"
  tags: [nginx, nginx_install]

# The nginx.org package ships conf.d/default.conf, which becomes the default server on :80
# until pastir.nginx_config removes it. Drop it right after the install, before nginx is
# started, but only while it is the package's untouched copy (md5 matches dpkg's conffile record).
- name: Remove the package default.conf
  when: nginx_remove_package_default_conf
  tags: [nginx, nginx_install]
  block:
    - name: Read nginx conffile checksums
      ansible.builtin.command: dpkg-query -W -f=${Conffiles} nginx
      register: __nginx_conffiles
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Check default.conf
      ansible.builtin.stat:
        path: "{{ __nginx_package_default_conf }}"
        checksum_algorithm: md5
      register: __nginx_default_conf

    - name: Delete unmodified default.conf
      ansible.builtin.file:
        path: "{{ __nginx_package_default_conf }}"
        state: absent
      register: __nginx_default_conf_removed
      when:
        - __nginx_default_conf.stat.exists
        - __nginx_default_conf.stat.checksum == __nginx_default_conf_pkg_md5

    - name: Warn about a modified default.conf
      ansible.builtin.debug:
        msg: >-
          [WARNING] {{ __nginx_package_default_conf }} differs from the nginx package's copy
          (or is not a package conffile) and was left in place.
      when:
        - __nginx_default_conf.stat.exists
        - __nginx_default_conf.stat.checksum != __nginx_default_conf_pkg_md5

- name: Hold nginx
  ansible.builtin.dpkg_selections:
    name: nginx
    selection: hold
  when: nginx_hold and not ansible_check_mode
  tags: [nginx, nginx_install]

- name: Create vhost directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ nginx_sites_available_dir }}"
    - "{{ nginx_sites_enabled_dir }}"
  when: nginx_sites_dirs
  tags: [nginx, nginx_install]

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: "{{ nginx_service_enabled }}"
    state: started
  register: __nginx_started
  tags: [nginx, nginx_install]

# The package's postinst may already have started nginx with default.conf loaded
# (e.g. when replacing a running nginx); apply its removal then.
- name: Reload nginx after removing default.conf
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  when:
    - __nginx_default_conf_removed is defined
    - __nginx_default_conf_removed is changed
    - __nginx_started is not changed
  tags: [nginx, nginx_install]
